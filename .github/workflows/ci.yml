#       packages: write
#     steps:
#       - build both images, push to ghcr.io
#       - ssh to the VM (key from secrets, host key pinned)
#       - docker compose pull && docker compose up -d
#       - curl the health endpoint; fail the job if it is not healthy
# ---------------------------------------------------------------------------
