# Security headers for HTML and static responses.
#   ->  frontend/security-headers.conf
#   copied by the Dockerfile to /etc/nginx/snippets/security-headers.conf
#
# WHY THIS IS A SEPARATE FILE
# nginx inherits add_header from a parent context ONLY if the child
# declares no add_header of its own. `location = /index.html` and
# `location /assets/` both set Cache-Control, so they would silently drop
# every server-level security header — and `try_files ... /index.html`
# internally redirects into that exact block, meaning every SPA route
# would serve the shell with no CSP at all. Restating the headers in each
# block is mandatory; keeping them in one file stops the three copies
# drifting apart.
#
# These values are copied verbatim from the policy FastAPI applies in
# main.py (it uses setdefault, so what the app emits today is exactly
# this). If that policy changes, change it here too — otherwise the API
# and the HTML document will disagree.
#
# Deliberately NOT included at server level or in `location /api/`:
# the backend already sets all five on API responses, and nginx's
# add_header appends rather than replaces, so including it there would
# emit duplicate headers — which some browsers treat as malformed.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "SAMEORIGIN" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
