# Render blueprint — one web service that serves both the API and the React
# bundle, so there is a single URL and no CORS in production.
#
# NOTE: this branch has no authentication. The blueprint is kept correct so
# that it is deployable the moment the OIDC client lands, but deploying it as
# it stands publishes the HAP tools to anyone with the URL.
#
# This file must sit at the ROOT of the repository, and the repository root
# must be this `hap_converter` folder: every path below is relative to it.
# If you instead push the parent folder, set the service's Root Directory to
# `hap_converter` in the Render dashboard or the paths will not resolve.
#
# The build compiles the frontend, then installs the Python side. Render's
# native Python runtime ships with Node; if your chosen runtime does not have
# it, see "Deploying without Node" in backend/README.md.

# No `databases:` block. The identity PostgreSQL is declared in
# maec-one-core's blueprint now, and belongs to that service alone —
# Engineering Tools holds no user records and must never hold credentials to
# the store that does. Leaving the declaration here would have provisioned a
# second, empty database on the next blueprint apply.

services:
  - type: web
    name: maec
    runtime: python
    plan: starter          # 512 MB is enough; a 350-page parse peaks well under it
    region: singapore      # nearest Render region to India; every upload
                           # crosses this distance. CANNOT be changed after
                           # the service is created — only by recreating it.
    buildCommand: |
      npm --prefix frontend ci
      npm --prefix frontend run build
      pip install -r backend/requirements.txt

    # One step now. The migration and the seed that ran ahead of uvicorn
    # were the identity schema's, and run in maec-one-core's blueprint
    # against its own database.
    startCommand: >-
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120

    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PYTHONUNBUFFERED
        value: "1"

      # Nothing else. DATABASE_URL, SESSION_SECRET, BOOTSTRAP_ADMIN_* and
      # SEED_TEST_USER_* were all the identity stack's and are set on
      # maec-one-core's service instead.
      #
      # What lands here with the OIDC client: the issuer URL for Core, this
      # service's client id, and its client secret (sync:false — it signs the
      # token exchange and must not sit in this file).
