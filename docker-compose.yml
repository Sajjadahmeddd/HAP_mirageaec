# MAEC — two images, one origin. Replaces the single Render service.
#
# v2 changes after Gate 0:
#   - env_file is .env.maec, NOT .env (the root .env belongs to MAEC One
#     and carries that project's DATABASE_URL / SESSION_SECRET) (B2)
#   - no ${...} interpolation of MAEC vars: compose interpolates from .env
#     only, which is the wrong project's file. All config arrives via
#     env_file, which compose passes straight to the container.
#   - RENDER=1 set deliberately — see the comment on it below.

name: maec

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: maec-backend:latest
    restart: unless-stopped

    # Everything (MAEC_EMAIL / MAEC_PASSWORD / MAEC_SECRET_KEY /
    # WEB_CONCURRENCY) comes from here. Never point this at .env.
    env_file: .env.maec

    environment:
      PORT: "8000"

      # INTERIM WART — remove when the follow-up commit lands.
      # main.py keys the Secure cookie flag and the HSTS header on the
      # presence of RENDER. Unset here, the session cookie would ship
      # without Secure and HSTS would be absent once Caddy fronts this.
      # Setting it preserves both with zero application code change.
      # FOLLOW-UP after Gate 9: rename that check to MAEC_HTTPS and delete
      # this line — a future maintainer on a Netcup box should not find a
      # variable called RENDER.
      RENDER: "1"

      # MAEC_DEV is deliberately absent. Setting it enables the permissive
      # CORS middleware intended only for the local Vite dev server.

    expose:
      - "8000"          # internal network only — never published to the host
    networks: [maec_net]

    tmpfs:
      # Uploads in RAM: faster than the overlay fs, and they cannot outlive
      # the container. Enforces the stateless design at the infra layer.
      - /tmp/maec-uploads:size=2g,mode=1777

    deploy:
      resources:
        limits:
          cpus: "7.0"
          memory: 12g
        reservations:
          memory: 1g

    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: maec-frontend:latest
    restart: unless-stopped
    ports:
      # The only port exposed. Put Caddy (or an ALB) in front for TLS and
      # then firewall this off from the public internet.
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [maec_net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  maec_net:
    driver: bridge
