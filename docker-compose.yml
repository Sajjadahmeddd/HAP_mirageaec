# MAEC — two images, one origin. Replaces the single Render service.
#
# v3: hardware-agnostic. No hardcoded CPU or memory figures, so this file
#     is correct on a 2-core laptop, a 4-core VM or a 16-core box without
#     being edited. The backend derives its worker count from the CPU
#     actually available to it at startup.

name: maec

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: maec-backend:latest
    restart: unless-stopped

    # The gate's settings live here: CORE_URL (Core inside Docker,
    # http://maec-core:8000), CORE_PUBLIC_URL, MAEC_APP_KEY and
    # MAEC_GATE_SECRET. See .env.maec.example.
    # Never point this at .env — that belongs to the MAEC One project.
    env_file: .env.maec

    environment:
      PORT: "8000"

      # WEB_CONCURRENCY is deliberately NOT set. The entrypoint reads the
      # container's cgroup CPU quota (or the visible core count) and uses
      # cores-1 workers. Set it in .env.maec only to override that.

      # INTERIM WART — remove when the follow-up commit lands.
      # main.py keys HSTS on the presence of RENDER (there is no session
      # cookie here any more: the cookie is MAEC One's). Setting it keeps
      # HSTS on with zero code change.
      # FOLLOW-UP: rename that check to MAEC_HTTPS and delete this line.
      RENDER: "1"

      # MAEC_DEV is deliberately absent — it enables permissive CORS.

      # The proxies uvicorn believes X-Forwarded-Proto from (and the app
      # X-Forwarded-Host): exactly maec_net's subnet below, where the nginx
      # container lives. Keep the two equal if either is changed.
      FORWARDED_ALLOW_IPS: "172.30.57.0/24"

    expose:
      - "8000"          # internal network only — never published to the host
    # MAEC One Core's compose project joins this network too (external,
    # as maec_maec_net) under the alias maec-core, so CORE_URL reaches it
    # here and the gate check never leaves the machine. Bring this stack up
    # before Core's, which expects the network to exist.
    networks: [maec_net]

    tmpfs:
      # Uploads in RAM: faster than the overlay fs, and they cannot outlive
      # the container. 1 GB is ample — a large drawing set is tens of MB.
      - /tmp/maec-uploads:size=1g,mode=1777

    # No resource limits by default. On a single-purpose VM there is
    # nothing to protect the app from, and a hardcoded "cpus: 7.0" is
    # simply wrong on a 4-core box. Add limits only when this host starts
    # running other applications alongside MAEC — then uncomment and set
    # figures that match THAT machine:
    #
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "3.0"
    #       memory: 4g

    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: maec-frontend:latest
    restart: unless-stopped
    ports:
      # The only port exposed, and bound to the loopback interface rather
      # than every interface. Docker publishes ports by writing DNAT rules
      # that sit in front of the host firewall, so a plain "80:80" is
      # reachable from the internet even with ufw denying it -- a trap
      # people usually find out about from their logs. The reverse proxy
      # that terminates TLS runs on the same host and reaches this through
      # loopback; nothing else needs to.
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [maec_net]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  maec_net:
    driver: bridge
    # A fixed subnet, so FORWARDED_ALLOW_IPS above can name it. Docker would
    # otherwise pick one at creation and the trusted range would be a guess.
    # If this ever clashes with a network already on the host, choose another
    # private /24 and change FORWARDED_ALLOW_IPS to match.
    ipam:
      config:
        - subnet: 172.30.57.0/24
