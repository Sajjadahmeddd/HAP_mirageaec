# MAEC — two images, one origin. Replaces the single Render service.
#
# v3: hardware-agnostic. No hardcoded CPU or memory figures, so this file
#     is correct on a 2-core laptop, a 4-core VM or a 16-core box without
#     being edited. The backend derives its worker count from the CPU
#     actually available to it at startup.

# Set here, not derived from the folder name: this stack runs NEXT TO the old
# Engineering Tools on the same VPS (project "maec", 127.0.0.1:8080, images
# maec-backend / maec-frontend) and Project Management (project "promanage",
# 127.0.0.1:8081), and must collide with none of it. It is served as
# engtools.mirageaec.com: Caddy's block for that name points at
# localhost:${ET_PORT}; et.mirageaec.com stays on the old stack.
#
# No docker-compose.override.yml is needed on the server, and none should
# exist there. Every command passes the settings file explicitly:
#   docker compose -f docker-compose.yml --env-file .env.maec up -d --build
name: maec-et

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # maec-et-*, not maec-*: the old stack (project "maec") tags its images
    # maec-backend / maec-frontend. Building this stack under those names would
    # retag the old stack's images, and any recreate of the old stack - a
    # rollback included - would then start THIS code.
    image: maec-et-backend:latest
    restart: unless-stopped

    # The gate's settings live here: CORE_URL (Core inside Docker,
    # http://maec-core:8000), CORE_PUBLIC_URL, MAEC_APP_KEY and
    # MAEC_GATE_SECRET. See .env.maec.example.
    # Never point this at .env — that belongs to the MAEC One project.
    env_file: .env.maec

    environment:
      PORT: "8000"

      # WEB_CONCURRENCY is deliberately NOT set. The entrypoint reads the
      # container's cgroup CPU quota (or the visible core count) and uses
      # cores-1 workers. Set it in .env.maec only to override that.

      # MAEC_DEV is deliberately absent — it enables permissive CORS.

      # The only peers whose X-Forwarded-Proto and X-Forwarded-Host are
      # believed (backend/maec_auth/proxy.py): et_net's range, where the nginx
      # container lives. Built from the same variable as the subnet below, so
      # the two cannot drift. NOT maec_core_net: Core and any other app there
      # reach this backend directly, and must not choose its scheme or host.
      TRUSTED_PROXIES: "${ET_NET_SUBNET:-10.231.2.0/24}"

    expose:
      - "8000"          # internal network only — never published to the host
    # et_net: nginx -> backend. maec_core_net: MAEC One Core's network,
    # created by Core's compose project, where Core answers as maec-core —
    # so CORE_URL=http://maec-core:8000 and the gate check never leaves the
    # machine. Bring Core's stack up first; it owns that network.
    networks: [et_net, maec_core_net]

    tmpfs:
      # Uploads in RAM: faster than the overlay fs, and they cannot outlive
      # the container. 1 GB is ample — a large drawing set is tens of MB.
      - /tmp/maec-uploads:size=1g,mode=1777

    # No resource limits by default. On a single-purpose VM there is
    # nothing to protect the app from, and a hardcoded "cpus: 7.0" is
    # simply wrong on a 4-core box. Add limits only when this host starts
    # running other applications alongside MAEC — then uncomment and set
    # figures that match THAT machine:
    #
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "3.0"
    #       memory: 4g

    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: maec-et-frontend:latest
    restart: unless-stopped
    ports:
      # The only port exposed, and bound to the loopback interface rather
      # than every interface. Docker publishes ports by writing DNAT rules
      # that sit in front of the host firewall, so a plain "80:80" is
      # reachable from the internet even with ufw denying it -- a trap
      # people usually find out about from their logs. The reverse proxy
      # that terminates TLS runs on the same host and reaches this through
      # loopback; nothing else needs to.
      # ET_PORT, default 8082: the old Engineering Tools holds 127.0.0.1:8080
      # and Project Management 127.0.0.1:8081. The default is the right port,
      # so it is right even if --env-file is forgotten.
      - "127.0.0.1:${ET_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [et_net]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  et_net:
    # Named explicitly, and not maec_maec_net: that is the old stack's.
    name: maec_et_net
    driver: bridge
    # A fixed range, so TRUSTED_PROXIES above can name it. It must overlap
    # neither the old stack's 172.30.57.0/24 nor Core's 10.231.0.0/24 and
    # 10.231.1.0/24. It is in 10.231.x beside Core's, outside Docker's default
    # address pools (172.17-31.x, 192.168.x), so a network Docker created on
    # its own cannot already hold it. Check what the host uses before changing:
    #   docker network inspect $(docker network ls -q) --format '{{.Name}} {{range .IPAM.Config}}{{.Subnet}}{{end}}'
    ipam:
      config:
        - subnet: "${ET_NET_SUBNET:-10.231.2.0/24}"
  maec_core_net:
    # MAEC One Core's network, created by its own compose project. External:
    # this stack joins it and never creates or removes it.
    external: true
    name: maec_core_net
