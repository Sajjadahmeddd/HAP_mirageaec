# MAEC front door.
# Serves the React bundle AND proxies /api to the backend container, so the
# browser sees a single origin — no CORS, no API base URL to inject, and the
# frontend keeps calling fetch('/api/...') exactly as it does today.

upstream maec_backend {
    # "backend" is the service name in docker-compose.yml
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- upload ceiling -------------------------------------------------
    # A 40-sheet A1 drawing set runs to tens of MB, and one sample sheet
    # alone carries a 15 MB content stream. nginx's default is 1 MB, which
    # would reject the batch before it ever reached FastAPI.
    client_max_body_size 1G;
    client_body_timeout  300s;
    client_body_buffer_size 1m;

    # Never serve a stale index.html from a proxy or CDN
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # --- container healthcheck -----------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- API ------------------------------------------------------------
    location /api/ {
        proxy_pass         http://maec_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # THE setting that Render did not let you control. A large rebadge
        # or a 350-page HAP parse can run for minutes; this is the ceiling
        # before the proxy gives up and returns 502. Raise it if a genuine
        # batch ever exceeds it — you own this number now.
        proxy_connect_timeout  30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # Buffer the upload to disk before handing it to the worker, so a
        # slow client cannot occupy a CPU-bound worker process while it
        # dribbles bytes in.
        proxy_request_buffering on;

        # Stream the response (zip download) straight through.
        proxy_buffering off;
    }

    # --- static bundle ---------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves users on old JS.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback — any unknown path renders the app, which then routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
