# MAEC front door.  ->  frontend/nginx.conf
# Serves the React bundle AND proxies /api to the backend container, so the
# browser sees a single origin — no CORS, no API base URL to inject, and the
# frontend keeps calling fetch('/api/...') unchanged.
#
# v3: security headers moved into snippets/security-headers.conf and
#     included in every block that serves HTML or static files. They are
#     NOT set at server level, because nginx drops inherited add_headers in
#     any location that declares its own — which silently disabled the CSP
#     on exactly the responses that needed it.

upstream maec_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- upload ceiling -------------------------------------------------
    # Deliberately ABOVE the application's own per-file limit
    # (MAX_UPLOAD_BYTES = 200 MB in deps.py). nginx lets the request
    # through so FastAPI can return its own clean, explained error rather
    # than the browser showing a bare nginx 413. Not a mismatch — a choice.
    client_max_body_size 1G;
    client_body_timeout  300s;
    client_body_buffer_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # --- container healthcheck ------------------------------------------
    location = /healthz {
        access_log off;
        # default_type, not add_header: add_header APPENDS, so it would
        # leave the response carrying two Content-Type values.
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API -------------------------------------------------------------
    # No security-headers include here: the backend already sets all five
    # on its own responses, and add_header appends rather than replaces.
    location /api/ {
        proxy_pass         http://maec_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The setting Render never exposed, and the direct cause of the
        # 502 on 40-sheet batches. You own this number now.
        proxy_connect_timeout  30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # Buffer the upload to disk first, so a slow client cannot occupy
        # a CPU-bound worker process while it dribbles bytes in.
        proxy_request_buffering on;

        # Stream the response (zip download) straight through.
        proxy_buffering off;
    }

    # --- hashed assets ----------------------------------------------------
    # Vite emits content-hashed filenames — safe to cache hard. This block
    # declares add_header, so it MUST restate the security headers.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # --- the SPA shell ----------------------------------------------------
    # try_files below internally redirects here, so this is the block that
    # actually serves every route. Without the include, no page in the app
    # would carry a CSP.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # --- everything else --------------------------------------------------
    # Real files (favicon, robots.txt, manifest) are served from here and
    # get the headers directly; unknown paths fall through to /index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
